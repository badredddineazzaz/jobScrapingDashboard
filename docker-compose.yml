services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jobscraper
      POSTGRES_USER: jobscraper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobscraper-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobscraper -d jobscraper"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      JOBSCRAPER_DATABASE_URL: postgresql+psycopg://jobscraper:${POSTGRES_PASSWORD:-jobscraper-local}@postgres:5432/jobscraper
      JOBSCRAPER_REDIS_URL: redis://redis:6379/0
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
